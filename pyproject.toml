[project]
name = "titan-hltv"
version = "0.0.1"
description = "CS2 demo (.dem) stats extractor (HLTV 3.0-style metrics)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "demoparser2",
]

[project.scripts]
titan-hltv = "titan_hltv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan_hltv"]
